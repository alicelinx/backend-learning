forcontu_cat.settings:
  path: '/admin/config/system/forcontu-cat'
  defaults:
    _form: '\Drupal\forcontu_cat\Form\ForcontuCatSettingsForm'
    _title: 'Forcontu CAT'
  requirements:
    _permission: 'forcontu cat settings'

forcontu_cat.messages:
  path: '/admin/structure/forcontu-cat-messages'
  defaults:
    _controller: '\Drupal\forcontu_cat\Controller\ForcontuCatController::messages'
  requirements:
    _permission: 'forcontu cat settings'

forcontu_cat.delete:
  path: '/admin/structure/forcontu-cat-messages/delete/{node}'
  defaults:
    _form: '\Drupal\forcontu_cat\Form\ForcontuCatDeleteForm'
    _title: 'Delete Form'
  requirements:
    _permission: 'forcontu cat settings'